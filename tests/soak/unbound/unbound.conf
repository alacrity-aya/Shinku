server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    verbosity: 1
    use-syslog: no
    logfile: "/opt/unbound/etc/unbound/log/unbound.log"

    # Restrict to test topology subnet
    access-control: 10.99.0.0/24 allow

    # Cache tuning for soak realism
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-min-ttl: 2
    cache-max-ttl: 60
    prefetch: yes

    # Keep test deterministic and avoid DNSSEC fetch complexity in soak base profile
    val-permissive-mode: yes

    # Performance knobs
    num-threads: 2
    outgoing-range: 4096
    num-queries-per-thread: 2048

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
